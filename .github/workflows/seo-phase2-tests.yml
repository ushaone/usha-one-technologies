name: SEO Phase 2 checks
on:
  push:
    branches:
      - seo-audit-engine-phase2
  pull_request:
    paths:
      - 'seo-preflight.html'
      - 'worker/seo-audit-phase2.js'
      - 'worker/seo-html-analysis.mjs'
      - 'worker/seo-controlled-fetch.mjs'
      - 'tests/seo-preflight.test.mjs'
      - 'tests/seo-audit-api.test.mjs'
      - 'tests/seo-html-analysis.test.mjs'
      - 'tests/seo-controlled-fetch.test.mjs'
      - '.github/workflows/seo-phase2-tests.yml'
permissions:
  contents: read
jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SEO Phase 2 offline tests
        run: node --test tests/seo-preflight.test.mjs tests/seo-audit-api.test.mjs tests/seo-html-analysis.test.mjs tests/seo-controlled-fetch.test.mjs
