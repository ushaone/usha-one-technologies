name: SEO Phase 2 checks
on:
  push:
    branches:
      - seo-audit-engine-phase2
  pull_request:
    paths:
      - 'seo-preflight.html'
      - 'seo-audit-report.html'
      - 'seo-offline-audit.html'
      - 'seo-offline-standalone.html'
      - 'scripts/**'
      - 'worker/**'
      - 'tests/**'
      - 'wrangler.seo-preview.jsonc'
      - '.github/workflows/seo-phase2-tests.yml'
permissions:
  contents: read
jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm static-only release candidate matches verified source
        run: node scripts/seo-release-candidate-verify.mjs
      - name: Confirm standalone offline tool matches audited sources
        run: node scripts/build-seo-standalone.mjs --check
      - name: Run all SEO Phase 2 tests
        run: node --test tests/seo-*.test.mjs
      - name: Smoke-test SEO tools in real headless Chrome
        run: node scripts/seo-browser-smoke.mjs
      - name: Verify mobile keyboard and accessibility semantics in real Chrome
        run: node scripts/seo-accessibility-smoke.mjs
      - name: Verify SEO report prints to a valid PDF
        run: node scripts/seo-print-pdf-smoke.mjs
      - name: Package ready-to-use offline SEO toolkit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          Path('dist').mkdir(exist_ok=True)
          output = Path('dist/usha-one-seo-offline-toolkit.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED) as z:
              z.write('seo-offline-standalone.html', 'seo-offline-standalone.html')
              z.write('seo-audit-report.html', 'seo-audit-report.html')
              z.write('tests/fixtures/seo-example-page.html', 'sample-page.html')
              z.writestr('README-FIRST.txt', (
                  'USHA ONE TECHNOLOGIES - OFFLINE SEO TOOLKIT\n'
                  '1. Open seo-offline-standalone.html in your browser.\n'
                  '2. Enter the original page URL, and choose a saved .html file.\n'
                  '3. Select sample-page.html to try the included example.\n'
                  '4. Analyze HTML and download the JSON report.\n'
                  '5. Open seo-audit-report.html, import that JSON, then Print / Save PDF.\n'
                  'This toolkit never crawls live websites and measures no rankings, indexing or page speed.\n'
              ))
          with ZipFile(output) as z:
              assert set(z.namelist()) == {
                  'seo-offline-standalone.html',
                  'seo-audit-report.html',
                  'sample-page.html',
                  'README-FIRST.txt',
              }
              assert z.testzip() is None
          print(f'OFFLINE ZIP PASS: {output} ({output.stat().st_size} bytes)')
          PY
      - name: Upload verified offline SEO toolkit ZIP
        uses: actions/upload-artifact@v4
        with:
          name: usha-one-seo-offline-toolkit
          path: dist/usha-one-seo-offline-toolkit.zip
          retention-days: 30
          if-no-files-found: error

  webkit-smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright WebKit test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install webkit
      - name: Run actual WebKit mobile, keyboard, export and import tests
        run: node scripts/seo-webkit-smoke.mjs
