name: ONE AI checks
on:
  pull_request:
    paths: ['one-ai/**', '.github/workflows/one-ai.yml']
  push:
    branches: ['feature/one-ai-master-foundation']
    paths: ['one-ai/**', '.github/workflows/one-ai.yml']
permissions:
  contents: read
concurrency:
  group: one-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-ai
    env:
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: one-ai/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit
      - run: npx wrangler d1 migrations apply one-ai-local-tests --local --config test/wrangler.toml
      - run: npx wrangler d1 execute one-ai-local-tests --local --config test/wrangler.toml --file test/seed.sql
      - run: node scripts/local-runtime.mjs --verify
      - run: npx wrangler deploy worker.mjs --dry-run --name one-ai-bundle-check --compatibility-date 2026-10-13 --outdir dist
